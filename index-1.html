<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Progress Tracker</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e7eaf1;--accent:#635bff;--good:#16a34a;--bad:#ef4444;--soft:#eef0ff;--shadow:0 8px 28px rgba(20,30,55,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body.dark{--bg:#0b1020;--card:#151b2e;--text:#f2f5ff;--muted:#9aa6bf;--line:#283149;--soft:#202746;--shadow:0 8px 28px rgba(0,0,0,.22)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1100px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:10px 12px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 2px 7px rgba(0,0,0,.04)}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:#fff;background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:15px}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}
.stat{padding:15px;border-radius:15px;background:var(--soft)}.stat .num{font-size:25px;font-weight:800}.stat small{color:var(--muted)}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.sectionTitle h2{font-size:18px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);outline:none}
textarea{min-height:85px;resize:vertical}
.formgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px}
.habit{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
.habitHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.habitName{font-weight:700;flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-width:0;text-align:center}
.day button{width:100%;aspect-ratio:1;border-radius:8px;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-size:11px}
.day button.done{background:var(--good);color:#fff;border-color:var(--good)}.day button.future{opacity:.35}
.day span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.progress{height:8px;background:var(--bg);border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:20px}
.twocol{grid-template-columns:1fr 1fr}.analytics{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:100px 1fr 45px;align-items:center;gap:8px;font-size:13px}.bar{height:10px;background:var(--bg);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calcell{min-height:48px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px}.calcell b{display:block}.level1{background:#dff7e6}.level2{background:#a9e7b9}.level3{background:#55c878}.level4{background:#16a34a;color:#fff}.dark .level1{background:#173622}.dark .level2{background:#1e6635}.dark .level3{background:#218d47}.dark .level4{background:#16a34a}
.badge{display:inline-flex;padding:7px 10px;border-radius:20px;background:var(--soft);font-size:12px;margin:3px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:8px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.formgrid .full{grid-column:1/-1}.top{align-items:flex-start}.actions{max-width:190px}.app{padding:10px}.card{padding:13px}.days{gap:3px}}
@media(max-width:430px){.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.brand h1{font-size:21px}.actions .btn{padding:8px 9px}}
@media print{.actions,.btn,input,textarea,select{display:none!important}.card{box-shadow:none}.app{max-width:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const KEY="progress_tracker_react_single_v2";
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const todayObj=new Date();
const initial={
 name:"",dark:false,habits:[
  {id:1,name:"Workout",target:20,done:{}},
  {id:2,name:"Study",target:25,done:{}},
  {id:3,name:"Sleep 7+ hrs",target:25,done:{}}
 ],sleep:{},notes:{},goal:"",achieved:"",improve:""
};
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){return initial}}
function App(){
 const [data,setData]=useState(load);
 const [month,setMonth]=useState(todayObj.getMonth());
 const [year,setYear]=useState(todayObj.getFullYear());
 const [newHabit,setNewHabit]=useState("");
 const [newTarget,setNewTarget]=useState(20);
 const [selectedDate,setSelectedDate]=useState(iso(year,month,todayObj.getDate()));
 const [reminders,setReminders]=useState(false);
 useEffect(()=>{localStorage.setItem(KEY,JSON.stringify(data));document.body.classList.toggle("dark",!!data.dark)},[data]);
 const dim=daysIn(year,month), prefix=`${year}-${String(month+1).padStart(2,"0")}`;
 const monthDates=Array.from({length:dim},(_,i)=>iso(year,month,i+1));
 const totals=data.habits.map(h=>({h,count:monthDates.filter(d=>h.done?.[d]).length}));
 const completed=totals.reduce((a,x)=>a+x.count,0);
 const possible=data.habits.length*dim;
 const overall=possible?Math.round(completed/possible*100):0;
 function streak(h){
  let s=0,d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<370;i++){let k=iso(d.getFullYear(),d.getMonth(),d.getDate());if(h.done?.[k])s++;else if(i>0)break;d.setDate(d.getDate()-1)}
  return s;
 }
 const streaks=data.habits.map(h=>({h,s:streak(h)}));
 const currentStreak=Math.max(0,...streaks.map(x=>x.s));
 const bestHabit=totals.length?[...totals].sort((a,b)=>b.count-a.count)[0]:null;
 const monthSleep=monthDates.map(d=>Number(data.sleep?.[d]?.hours||0)).filter(Boolean);
 const avgSleep=monthSleep.length?(monthSleep.reduce((a,b)=>a+b,0)/monthSleep.length).toFixed(1):"0.0";
 const achievements=[
  overall>=25&&"🚀 25% Month",
  overall>=50&&"🔥 50% Month",
  overall>=75&&"💪 75% Month",
  overall===100&&"🏆 Perfect Month",
  currentStreak>=3&&"🔥 3 Day Streak",
  currentStreak>=7&&"⚡ 7 Day Streak",
  currentStreak>=30&&"👑 30 Day Streak"
 ].filter(Boolean);
 function toggle(hid,date){
  setData(x=>({...x,habits:x.habits.map(h=>h.id===hid?{...h,done:{...h.done,[date]:!h.done?.[date]}}:h)}));
 }
 function addHabit(){
  if(!newHabit.trim())return;
  setData(x=>({...x,habits:[...x.habits,{id:Date.now(),name:newHabit.trim(),target:Number(newTarget)||20,done:{}}]}));
  setNewHabit("");
 }
 function removeHabit(id){if(confirm("Is habit ko delete karna hai?"))setData(x=>({...x,habits:x.habits.filter(h=>h.id!==id)}))}
 function changeMonth(v){let d=new Date(year,month+v,1);setYear(d.getFullYear());setMonth(d.getMonth());setSelectedDate(iso(d.getFullYear(),d.getMonth(),1))}
 function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="progress-tracker-backup.json";a.click();URL.revokeObjectURL(a.href)}
 function restore(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{setData(JSON.parse(r.result));alert("Backup restore ho gaya!")}catch{alert("Backup file valid nahi hai.")}};r.readAsText(f)}
 function notify(){
  if(!("Notification"in window)){alert("Is browser me notifications supported nahi hain.");return}
  Notification.requestPermission().then(p=>{if(p==="granted"){setReminders(true);new Notification("Progress Tracker",{body:"Aaj ke habits complete karna mat bhoolna 💪"})}})
 }
 const selectedSleep=data.sleep?.[selectedDate]||{bed:"",wake:"",hours:""};
 function saveSleep(field,val){
  let s={...selectedSleep,[field]:val};
  if(s.bed&&s.wake){
   let [bh,bm]=s.bed.split(":").map(Number),[wh,wm]=s.wake.split(":").map(Number);
   let mins=(wh*60+wm)-(bh*60+bm);if(mins<0)mins+=1440;s.hours=(mins/60).toFixed(1);
  }
  setData(x=>({...x,sleep:{...x.sleep,[selectedDate]:s}}));
 }
 const note=data.notes?.[selectedDate]||"";
 const first=new Date(year,month,1).getDay();
 const cal=Array(first).fill(null).concat(monthDates);
 return <div className="app">
  <div className="top">
   <div className="brand"><h1>📈 Progress Tracker</h1><p>{data.name?`Hi ${data.name} 👋`:"Build consistency. Track progress."}</p></div>
   <div className="actions">
    <button className="btn" onClick={()=>setData(x=>({...x,dark:!x.dark}))}>{data.dark?"☀️":"🌙"}</button>
    <button className="btn" onClick={backup}>💾 Backup</button>
    <label className="btn">↩️ Restore<input type="file" accept=".json" hidden onChange={restore}/></label>
    <button className="btn" onClick={()=>window.print()}>🖨️</button>
   </div>
  </div>

  <div className="card">
   <div className="formgrid">
    <input className="full" placeholder="Your name" value={data.name} onChange={e=>setData(x=>({...x,name:e.target.value}))}/>
    <select value={month} onChange={e=>{setMonth(+e.target.value);setSelectedDate(iso(year,+e.target.value,1))}}>
     {Array.from({length:12},(_,i)=><option value={i}>{new Date(2000,i,1).toLocaleString("en",{month:"long"})}</option>)}
    </select>
    <input type="number" value={year} onChange={e=>setYear(+e.target.value||year)}/>
    <button className="btn primary" onClick={()=>{setMonth(todayObj.getMonth());setYear(todayObj.getFullYear())}}>This Month</button>
   </div>
  </div>

  <div className="grid stats">
   <div className="stat"><small>Overall Progress</small><div className="num">{overall}%</div></div>
   <div className="stat"><small>Completed</small><div className="num">{completed}</div></div>
   <div className="stat"><small>Current Streak</small><div className="num">🔥 {currentStreak}</div></div>
   <div className="stat"><small>Average Sleep</small><div className="num">😴 {avgSleep}h</div></div>
  </div>

  <div className="card">
   <div className="sectionTitle"><h2>📅 Calendar Overview</h2><div className="row"><button className="btn" onClick={()=>changeMonth(-1)}>‹</button><b>{new Date(year,month,1).toLocaleString("en",{month:"long",year:"numeric"})}</b><button className="btn" onClick={()=>changeMonth(1)}>›</button></div></div>
   <div className="calendar">{cal.map((d,i)=>d?<div className={"calcell "+(()=>{let c=data.habits.filter(h=>h.done?.[d]).length;return c>=3?"level4":c===2?"level3":c===1?"level2":""})()} onClick={()=>setSelectedDate(d)}><b>{Number(d.slice(-2))}</b><span>{data.habits.filter(h=>h.done?.[d]).length}/{data.habits.length} done</span></div>:<div className="calcell"></div>)}</div>
  </div>

  <div className="card">
   <div className="sectionTitle"><h2>✅ Habits</h2></div>
   <div className="formgrid">
    <input className="full" placeholder="New habit e.g. Reading" value={newHabit} onChange={e=>setNewHabit(e.target.value)}/>
    <input type="number" min="1" max={dim} value={newTarget} onChange={e=>setNewTarget(e.target.value)}/>
    <button className="btn primary" onClick={addHabit}>＋ Add Habit</button>
   </div>
   <p style={{color:"var(--muted)",fontSize:12}}>Target = monthly goal. Tap any day to mark complete.</p>
   {!data.habits.length?<div className="empty">Abhi koi habit nahi hai.</div>:data.habits.map(h=>{
    let count=totals.find(x=>x.h.id===h.id)?.count||0,p=Math.min(100,Math.round(count/h.target*100));
    return <div className="habit">
     <div className="habitHead"><span className="habitName">{h.name}</span><span>{count}/{h.target}</span><button className="btn danger" style={{padding:"6px 8px"}} onClick={()=>removeHabit(h.id)}>×</button></div>
     <div className="progress"><i style={{width:p+"%"}}/></div>
     <div className="days" style={{marginTop:9}}>{monthDates.map(d=><div className="day"><button className={h.done?.[d]?"done":""} onClick={()=>toggle(h.id,d)}>{Number(d.slice(-2))}</button><span>{new Date(d+"T00:00:00").toLocaleString("en",{weekday:"short"}).slice(0,1)}</span></div>)}</div>
    </div>
   })}
  </div>

  <div className="grid twocol">
   <div className="card"><div className="sectionTitle"><h2>📊 Analytics</h2></div>
    <div className="analytics">{totals.map(x=><div className="barrow"><span>{x.h.name}</span><div className="bar"><i style={{width:(x.count/dim*100)+"%"}}/></div><b>{Math.round(x.count/dim*100)}%</b></div>)}</div>
    {bestHabit&&<p style={{color:"var(--muted)",fontSize:13}}>This month most completed: <b>{bestHabit.h.name}</b> ({bestHabit.count})</p>}
   </div>
   <div className="card"><div className="sectionTitle"><h2>🏆 Achievements</h2></div>
    {achievements.length?achievements.map(a=><span className="badge">{a}</span>):<div className="empty">Progress karo — badges yahan unlock honge.</div>}
    <hr style={{border:0,borderTop:"1px solid var(--line)",margin:"14px 0"}}/>
    <p style={{margin:"5px 0",fontSize:13}}>Best current habit streaks:</p>
    {streaks.map(x=><div className="row" style={{justifyContent:"space-between",fontSize:13,padding:"5px 0"}}><span>{x.h.name}</span><b>🔥 {x.s} days</b></div>)}
   </div>
  </div>

  <div className="card">
   <div className="sectionTitle"><h2>😴 Sleep Tracker</h2><select style={{maxWidth:180}} value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}>{monthDates.map(d=><option value={d}>{d}</option>)}</select></div>
   <div className="formgrid">
    <label>Bed<input type="time" value={selectedSleep.bed} onChange={e=>saveSleep("bed",e.target.value)}/></label>
    <label>Wake<input type="time" value={selectedSleep.wake} onChange={e=>saveSleep("wake",e.target.value)}/></label>
    <label>Hours<input value={selectedSleep.hours||""} readOnly/></label>
   </div>
  </div>

  <div className="grid twocol">
   <div className="card"><div className="sectionTitle"><h2>🎯 Monthly Goal</h2></div>
    <input placeholder="Is month ka main goal..." value={data.goal} onChange={e=>setData(x=>({...x,goal:e.target.value}))}/>
    <textarea style={{marginTop:8}} placeholder="Kya achieve kiya?" value={data.achieved} onChange={e=>setData(x=>({...x,achieved:e.target.value}))}/>
    <textarea style={{marginTop:8}} placeholder="Next month kya improve karna hai?" value={data.improve} onChange={e=>setData(x=>({...x,improve:e.target.value}))}/>
   </div>
   <div className="card"><div className="sectionTitle"><h2>📝 Daily Note</h2><span style={{fontSize:12,color:"var(--muted)"}}>{selectedDate}</span></div>
    <textarea placeholder="Aaj kaisa raha?..." value={note} onChange={e=>setData(x=>({...x,notes:{...x.notes,[selectedDate]:e.target.value}}))}/>
    <div style={{marginTop:10}}><button className="btn primary" onClick={notify}>🔔 Test Reminder</button>{reminders&&<span style={{fontSize:12,color:"var(--muted)",marginLeft:8}}>Notifications allowed</span>}</div>
   </div>
  </div>
  <div className="footer">Your data stays in this browser using local storage. Backup regularly before clearing browser data.</div>
 </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
