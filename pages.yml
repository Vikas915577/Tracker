name: Deploy Winter Arc Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate website core
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/webcore/index.html
          test -f assets/webcore/app.js
          test -f assets/webcore/styles.css
          test -f assets/webcore/v25-overrides.css
          test -f assets/webcore/cloud-config.js
          test -f assets/webcore/sw.js
          test -f assets/webcore/manifest.json
          test -f assets/webcore/icon-192.png
          test -f assets/webcore/icon-512.png
          test -f assets/webcore/creator-profile.jpg
          node --check assets/webcore/app.js
          grep -q 'cloud-config.js' assets/webcore/index.html
          grep -q 'supabase-js' assets/webcore/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: assets/webcore

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
