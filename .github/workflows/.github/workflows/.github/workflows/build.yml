name: Install Winter Arc V25.4

on:
  workflow_dispatch:

  push:
    paths:
      - "Winter-Arc-V25.4-Production-Ready.zip"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract production package
        run: |
          set -e

          rm -rf __v25_install
          mkdir -p __v25_install

          unzip -q "Winter-Arc-V25.4-Production-Ready.zip" -d __v25_install

          # Do not replace GitHub workflow files.
          # GitHub App currently does not have workflow-write permission.
          rm -rf "__v25_install/.github/workflows"

          cp -a __v25_install/. ./

          rm -rf __v25_install
          rm -f "Winter-Arc-V25.4-Production-Ready.zip"

      - name: Verify production structure
        run: |
          set -e

          echo "Checking Winter Arc V25.4 structure..."

          test -d "assets"
          test -d "backend"
          test -d "lib"
          test -d "tool"

          echo "Production folders found:"
          ls -la

          echo "Winter Arc V25.4 structure check PASSED."

      - name: Commit extracted production files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install Winter Arc V25.4 production files"
            git push
          fi
