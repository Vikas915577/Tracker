name: Winter Arc Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter platforms
        run: bash ./tool/prepare_platforms.sh

      - name: Remove default Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Fix flutter_inappwebview Android ProGuard config for AGP 9+
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find "$HOME/.pub-cache" -type f -path '*/flutter_inappwebview_android-*/android/build.gradle' 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "flutter_inappwebview_android build.gradle not found"
            exit 1
          fi
          while IFS= read -r f; do
            echo "Patching $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
          done <<< "$matches"

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v25-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Winter Arc web core
        uses: actions/upload-pages-artifact@v3
        with:
          path: assets/webcore

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
