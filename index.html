<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Progress Tracker V8.1.1</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e3e8f0;
  --accent:#635bff;--accent2:#8b5cf6;--good:#16a34a;--bad:#ef4444;--soft:#eef0ff;
  --warn:#f59e0b;--shadow:0 8px 28px rgba(20,30,60,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body.dark{
  --bg:#0b1220;--card:#141c2e;--text:#f4f7ff;--muted:#9aa8c0;--line:#29344b;
  --soft:#202846;--shadow:0 8px 28px rgba(0,0,0,.28)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1120px;margin:auto;padding:12px 12px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0 14px}
.title h1{margin:0;font-size:25px}
.title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:9px 11px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.danger{color:var(--bad)}
.small{font-size:12px;padding:7px 9px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}
.tab{white-space:nowrap}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:13px;box-shadow:var(--shadow)}
.grid{display:grid;gap:10px}
.stats{grid-template-columns:repeat(5,1fr)}
.stat{background:var(--soft);border-radius:15px;padding:12px}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:22px;margin-top:3px}
.section{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.section h2{margin:0;font-size:18px}
.muted{color:var(--muted)}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.form label{font-size:12px;color:var(--muted)}
input,textarea,select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:100px;resize:vertical}
.today-box{border:2px solid var(--accent);background:linear-gradient(135deg,var(--soft),var(--card))}
.today-list{display:grid;gap:8px}
.today-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px}
.bigcheck{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:23px;flex:0 0 auto}
.bigcheck.done{background:var(--good);border-color:var(--good);color:#fff}
.bigcheck.freeze{background:var(--warn);border-color:var(--warn);color:#fff}
.today-row.done .habit-name{text-decoration:line-through;opacity:.65}
.matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix{min-width:720px;border-collapse:separate;border-spacing:4px;width:100%}
.matrix th{font-size:10px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card);z-index:2}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--card);z-index:3}
.matrix td{height:38px;text-align:center}
.matrix .habit-cell{text-align:left;min-width:160px;padding:7px;font-size:12px;font-weight:600}
.daycheck{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:transparent}
.daycheck.done{background:var(--good);border-color:var(--good);color:#fff}
.daycheck.today{outline:2px solid var(--accent);outline-offset:-2px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:7px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
.heat .on{background:var(--accent);color:#fff}
.heat .today{outline:2px solid var(--accent)}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;background:var(--soft);padding:6px 9px;border-radius:10px;margin:3px;font-size:12px}
.goalbar{display:flex;gap:8px;align-items:center}
.goalbar .bar{flex:1}
.empty{padding:18px;text-align:center;color:var(--muted)}
.motivation{background:linear-gradient(135deg,var(--soft),var(--card));border:2px solid var(--accent)}
.motive-title{display:flex;justify-content:space-between;gap:8px;align-items:center}
.motive-title h2{margin:0;font-size:18px}
.motive-msg{font-size:15px;line-height:1.45;margin:8px 0}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.mini b{display:block;font-size:18px}
.mini small{color:var(--muted)}
.challenge{border:1px dashed var(--accent);border-radius:14px;padding:11px;background:var(--card)}
.plan-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.habit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.habit-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;position:relative}
.habit-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.habit-icon{font-size:26px}
.habit-name{font-weight:800;font-size:16px}
.habit-meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.habit-meta span{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:11px}
.habit-actions{display:flex;gap:6px;margin-top:10px}
.habit-actions .btn{flex:1}
.streak{font-size:30px;font-weight:900;line-height:1}
.streak small{font-size:12px;color:var(--muted);font-weight:600}
.calendar7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}
.calday{min-width:0;text-align:center}
.calday small{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}
.dot{height:28px;border-radius:8px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}
.dot.on{background:var(--good);color:#fff}
.dot.today{outline:2px solid var(--accent);outline-offset:-2px}
.private-pill{background:#fff4e8!important;color:#a15c00!important}
body.dark .private-pill{background:#352714!important;color:#ffd28a!important}
.overlay{position:fixed;inset:0;background:rgba(7,14,28,.58);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{max-width:720px;width:100%;max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px}
.modal p{color:var(--muted);margin:6px 0 14px}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0}
.preset{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px;text-align:left}
.preset.selected{border-color:var(--accent);background:var(--soft)}
.preset .line{display:flex;gap:10px;align-items:center}
.preset input{width:auto}
.private-section{margin-top:12px}
.custom-row{display:flex;gap:8px}
.custom-row input{flex:1}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lock{font-size:12px;color:var(--muted)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.big-number{font-size:42px;font-weight:900;line-height:1}
.two{grid-template-columns:repeat(2,1fr)}
.three{grid-template-columns:repeat(3,1fr)}
.note{background:var(--soft);padding:10px;border-radius:12px;font-size:13px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:50}
.bottom button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:12px;font-size:11px}
.bottom button.active{background:var(--soft);color:var(--accent);font-weight:700}
@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats .stat:last-child{grid-column:span 2}
  .form{grid-template-columns:1fr}
  .title h1{font-size:21px}
  .actions{max-width:175px}
  .bottom button{padding:7px 9px}
  .today-row{padding:9px}
  .matrix{min-width:700px}
  .habit-grid{grid-template-columns:1fr}
  .preset-grid{grid-template-columns:1fr}
  .two,.three{grid-template-columns:1fr}
}
@media print{
  .bottom,.actions,.tabs,.habit-actions{display:none!important}
  .app{padding-bottom:10px}
  .card{box-shadow:none}
}

.day-motivation{background:linear-gradient(135deg,var(--soft),var(--card));border:2px solid var(--accent);position:relative;overflow:hidden}
.day-motivation:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-35px;top:-35px;background:var(--soft);opacity:.8}
.day-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800}
.quote{font-size:17px;font-weight:800;line-height:1.4;margin:9px 0;max-width:760px}
.subquote{font-size:12px;color:var(--muted);line-height:1.45}
.milestones{display:flex;gap:6px;overflow:auto;padding:2px 0 4px}
.milestone{min-width:68px;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:10px}
.milestone b{display:block;font-size:16px}
.milestone.on{border-color:var(--accent);background:var(--soft)}
.winpop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:scale(1);opacity:1}}
.identity{font-size:13px;font-weight:700;padding:10px;border-radius:12px;background:var(--soft)}
.reflection{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reflection .mini{min-height:75px}
@media(max-width:760px){.reflection{grid-template-columns:1fr}}


.v8-hero{background:linear-gradient(135deg,var(--soft),var(--card));border:2px solid var(--accent);overflow:hidden;position:relative}
.v8-hero:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-70px;background:var(--accent);opacity:.08}
.score-ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--score)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.score-ring span{width:82px;height:82px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}
.score-ring b{font-size:23px;line-height:1}
.hero-flex{display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;z-index:1}
.hero-copy{flex:1}
.hero-copy h2{font-size:22px;margin:0 0 5px}
.hero-copy p{margin:0;color:var(--muted);line-height:1.45}
.quick-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.focus-card{border:1px solid var(--accent);background:var(--soft)}
.focus-row{display:flex;align-items:center;gap:10px}
.focus-icon{font-size:30px}
.focus-check{width:50px;height:50px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-size:25px}
.focus-check.done{background:var(--good)}
.challenge-grid{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.mission-list{display:grid;gap:8px}
.mission-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--card)}
.mission-item input{width:auto}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(99,91,255,.0)}50%{box-shadow:0 0 0 8px rgba(99,91,255,.08)}}
.spark{position:fixed;pointer-events:none;z-index:130;font-size:25px;animation:spark 900ms ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.8);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-120px) scale(1.2);opacity:0}}
.modal-wide{max-width:900px}
.range-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.range-row input[type=range]{padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 9px;font-size:11px}
.chip.active{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.wbar{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px;height:100%}
.wbar i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.wbar small{font-size:9px;color:var(--muted)}
.private-toggle{display:flex;align-items:center;gap:8px}
.private-toggle input{width:auto}
table.clean{width:100%;border-collapse:collapse}
table.clean td,table.clean th{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.recovery{border:1px dashed var(--warn);background:rgba(245,158,11,.06)}
.success-line{color:var(--good);font-weight:700}
.warning-line{color:var(--warn);font-weight:700}
.v8-footer{font-size:11px;text-align:center;color:var(--muted);padding:8px}
@media(max-width:760px){
  .hero-flex{align-items:flex-start}
  .score-ring{width:88px;height:88px}
  .score-ring span{width:70px;height:70px}
  .hero-copy h2{font-size:19px}
  .challenge-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

const KEY="progress_tracker_v8";
const OLD_KEYS=["progress_tracker_v6","progress_tracker_v5","progress_tracker_v4","progress_tracker_v3_plain"];
const $=s=>document.querySelector(s);
const today=()=>{
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const currentMonth=()=>today().slice(0,7);
const daysInMonth=m=>{const [y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()};
const makeDays=m=>Array.from({length:daysInMonth(m)},(_,i)=>m+"-"+String(i+1).padStart(2,"0"));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

const PRESETS=[
  {name:"Exercise",icon:"🏃",cat:"Health"},
  {name:"Study / Work",icon:"📚",cat:"Focus"},
  {name:"Drink Water",icon:"💧",cat:"Health"},
  {name:"Read",icon:"📖",cat:"Mind"},
  {name:"Meditation",icon:"🧘",cat:"Mind"},
  {name:"Sleep on Time",icon:"😴",cat:"Health"},
  {name:"Walk",icon:"🚶",cat:"Health"},
  {name:"Healthy Food",icon:"🥗",cat:"Health"},
  {name:"Less Phone",icon:"📵",cat:"Focus"},
  {name:"Masturbation",icon:"🔒",cat:"Private",private:true}
];

const defaults=()=>({
  name:"",
  month:currentMonth(),
  habits:[],
  checks:{},
  freezes:{},
  sleep:{},
  notes:{},
  goal:"",
  achieved:"",
  improve:"",
  target:7,
  ifThen:"",
  barrier:"",
  win:"",
  dark:false,
  xp:0,
  onboardingDone:false
});

let data=load();
let tab="home";
let selectedHabit=null;
let toastTimer=null;

function load(){
  try{
    const current=JSON.parse(localStorage.getItem(KEY)||"null");
    if(current) return normalize(current);
    for(const k of OLD_KEYS){
      const old=JSON.parse(localStorage.getItem(k)||"null");
      if(old){
        const migrated=normalize(old);
        migrated.onboardingDone=!!migrated.name;
        saveObj(migrated);
        return migrated;
      }
    }
  }catch(e){}
  return defaults();
}
function normalize(x){
  const d=Object.assign(defaults(),x||{});
  if(!Array.isArray(d.habits)) d.habits=[];
  d.habits=d.habits.map(h=>{
    if(typeof h==="string") return {id:uid(),name:h,icon:"✅",private:false,created:currentMonth()};
    return Object.assign({id:uid(),name:"Habit",icon:"✅",private:false,created:currentMonth()},h);
  }).filter(h=>h.name);
  d.checks=d.checks&&typeof d.checks==="object"?d.checks:{};
  d.freezes=d.freezes&&typeof d.freezes==="object"?d.freezes:{};
  d.freezeUsed=d.freezeUsed&&typeof d.freezeUsed==="object"?d.freezeUsed:{};
  return d;
}
function saveObj(obj){try{localStorage.setItem(KEY,JSON.stringify(obj))}catch(e){}}
function save(){saveObj(data)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function key(h,d){return h.id+"|"+d}
function done(h,d){return !!data.checks[key(h,d)]}
function frozen(h,d){return !!data.freezes[key(h,d)]}
function active(h,d){return done(h,d)||frozen(h,d)}


function celebrate(){
  const emojis=["✨","🔥","🎉","💪","⭐","🚀"];
  emojis.forEach((e,i)=>{
    const el=document.createElement("div");
    el.className="spark";el.textContent=e;
    el.style.left=(42+Math.random()*16)+"%";
    el.style.bottom=(90+Math.random()*30)+"px";
    el.style.setProperty("--dx",((Math.random()-.5)*180)+"px");
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),950+i*30);
  });
}

function addXp(n){
  data.xp=(data.xp||0)+n;
  save();
}
function level(){return Math.floor((data.xp||0)/100)+1}
function xpToNext(){return (data.xp||0)%100}

function toggle(h,d){
  const k=key(h,d);
  const wasDone=done(h,d);
  if(frozen(h,d)) delete data.freezes[k];
  if(!wasDone){
    data.checks[k]=true;
    addXp(10);
    showToast("Nice! +10 XP 🔥");
    celebrate();
  }else{
    delete data.checks[k];
    save();
    showToast("Check removed");
  }
  render();
}
function freezeMonthKey(){return currentMonth()}
function freezeAvailable(){return !data.freezeUsed[freezeMonthKey()]}

function useFreeze(h,d){
  const k=key(h,d);
  if(done(h,d)) return;
  if(frozen(h,d)){
    delete data.freezes[k];
    delete data.freezeUsed[freezeMonthKey()];
    save();render();return;
  }
  if(!freezeAvailable()){
    showToast("This month's freeze is already used 🛡️");
    return;
  }
  data.freezes[k]=true;
  data.freezeUsed[freezeMonthKey()]=true;
  save();
  showToast("Monthly Streak Freeze used 🛡️");
  render();
}
function days(){return makeDays(data.month)}
function allStoredDates(){
  const set=new Set();
  Object.keys(data.checks||{}).forEach(k=>set.add(k.split("|")[1]));
  Object.keys(data.freezes||{}).forEach(k=>set.add(k.split("|")[1]));
  Object.keys(data.sleep||{}).forEach(d=>set.add(d));
  Object.keys(data.notes||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(d=>set.add(d));
  set.add(today());
  const first=data.habits.reduce((min,h)=>h.created && h.created<min?h.created:min,today());
  set.add(first);
  const arr=[...set].filter(d=>/^\\d{4}-\\d{2}-\\d{2}$/.test(d)).sort();
  // Give a useful rolling window, while still preserving all historical check dates.
  const anchor=new Date(today()+"T12:00:00");
  const earliest=new Date((arr[0]||today())+"T12:00:00");
  const span=Math.max(1,Math.ceil((anchor-earliest)/86400000)+1);
  const n=Math.min(3650,Math.max(span,365));
  const out=[];
  for(let i=n-1;i>=0;i--){
    const dt=new Date(anchor);dt.setDate(anchor.getDate()-i);
    out.push(dt.toISOString().slice(0,10));
  }
  return out;
}
function lifetimeDays(h){return allStoredDates()}
function streakRunFor(h){
  const ds=allStoredDates();
  let run=0;
  for(let i=ds.length-1;i>=0;i--){
    const d=ds[i];
    if(active(h,d)) run++;
    else if(d===today()) continue;
    else break;
  }
  return run;
}
function bestStreakFor(h){
  const ds=allStoredDates(); let longest=0,cur=0;
  ds.forEach(d=>{
    if(active(h,d)){cur++;longest=Math.max(longest,cur)}
    else cur=0;
  });
  return longest;
}
function habitStats(h){
  const md=days(), all=allStoredDates();
  const total=all.filter(d=>done(h,d)).length;
  const run=streakRunFor(h);
  const longest=bestStreakFor(h);
  const last7=md.slice(-7);
  const weekDone=last7.filter(d=>active(h,d)).length;
  const monthDone=md.filter(d=>done(h,d)).length;
  const monthEligible=md.filter(d=>d>=(h.created||md[0])&&d<=today()).length||md.length;
  const monthPct=monthEligible?Math.round(monthDone/monthEligible*100):0;
  const weekPct=last7.length?Math.round(weekDone/last7.length*100):0;
  return {total,run,longest,weekDone,monthPct,weekPct};
}
function stats(){
  const md=days(),all=allStoredDates();
  const eligibleDays=md.filter(d=>d<=today()).length;
  const total=data.habits.length*eligibleDays;
  let completed=0;
  md.forEach(d=>data.habits.forEach(h=>{if(done(h,d))completed++}));
  const todayDone=data.habits.filter(h=>done(h,today())).length;
  const fullRun=(()=>{
    let r=0; for(let i=all.length-1;i>=0;i--){
      const d=all[i];
      if(data.habits.length&&data.habits.every(h=>active(h,d)))r++;
      else if(d===today())continue;
      else break;
    } return r;
  })();
  let longest=0,run=0;
  all.forEach(d=>{
    if(data.habits.length&&data.habits.every(h=>active(h,d))){run++;longest=Math.max(longest,run)}
    else run=0;
  });
  let bestH=null,best=0;
  data.habits.forEach(h=>{
    const n=habitStats(h).total;
    if(n>best){best=n;bestH=h}
  });
  let sleep=md.map(d=>Number(data.sleep[d]?.hours)).filter(Boolean);
  const avg=sleep.length?sleep.reduce((a,b)=>a+b,0)/sleep.length:0;
  const score=weeklyScore();
  return {total,completed,pct:total?Math.round(completed/total*100):0,todayDone,fullStreak:fullRun,longest,bestH,best,avg,score};
}
function checkedCount(d){return data.habits.filter(h=>done(h,d)).length}
function activeCount(d){return data.habits.filter(h=>active(h,d)).length}

function motivation(s){
  const total=data.habits.length, td=s.todayDone;
  if(!total)return {msg:"Add one small habit and start your first win today.",tag:"START"};
  if(td===total)return {msg:"Perfect day! You showed up for every habit. 🔥",tag:"FULL DAY"};
  if(td>=Math.max(1,Math.ceil(total*.7)))return {msg:"You are close. Finish one more habit and keep the momentum going. 💪",tag:"ALMOST"};
  if(td>0)return {msg:"Small wins count. You already started today — keep going. 🌱",tag:"MOMENTUM"};
  return {msg:"No pressure. Pick the easiest habit and get one win right now. ▶️",tag:"ONE WIN"};
}
function weeklyScore(){
  const ds=days().slice(-7);
  const total=data.habits.length*Math.max(1,ds.length);
  if(!data.habits.length)return 0;
  return Math.round(ds.reduce((a,d)=>a+activeCount(d),0)/total*100);
}
function challengeText(s){
  if(!data.habits.length)return "Create your first habit.";
  if(s.todayDone===0)return "2-minute start: complete your easiest habit.";
  if(s.todayDone<data.habits.length)return "Finish one more habit today.";
  return "Protect your momentum: keep tomorrow's easiest habit ready.";
}
function formatDay(d){
  const dt=new Date(d+"T12:00:00");
  return dt.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function showToast(msg){
  clearTimeout(toastTimer);
  let old=document.querySelector(".toast");
  if(old) old.remove();
  const el=document.createElement("div");
  el.className="toast";
  el.textContent=msg;
  document.body.appendChild(el);
  toastTimer=setTimeout(()=>el.remove(),1800);
}
function iconFor(name){
  return name==="Exercise"?"🏃":name==="Study / Work"?"📚":name==="Drink Water"?"💧":name==="Read"?"📖":name==="Meditation"?"🧘":name==="Sleep on Time"?"😴":name==="Walk"?"🚶":name==="Healthy Food"?"🥗":name==="Less Phone"?"📵":name==="Masturbation"?"🔒":"✅";
}
function addHabit(name,icon="✅",priv=false){
  const trimmed=String(name||"").trim();
  if(!trimmed)return false;
  if(data.habits.some(h=>h.name.toLowerCase()===trimmed.toLowerCase())){showToast("That habit already exists.");return false}
  data.habits.push({id:uid(),name:trimmed,icon,private:!!priv,created:currentMonth()});
  save();
  return true;
}
function removeHabit(h){
  if(!confirm("Delete this habit and its history?"))return;
  data.habits=data.habits.filter(x=>x.id!==h.id);
  Object.keys(data.checks).forEach(k=>{if(k.startsWith(h.id+"|"))delete data.checks[k]});
  Object.keys(data.freezes).forEach(k=>{if(k.startsWith(h.id+"|"))delete data.freezes[k]});
  if(selectedHabit===h.id) selectedHabit=null;
  save();render();
}
function editHabit(h){
  const name=prompt("Habit name",h.name);
  if(name===null)return;
  const n=name.trim();
  if(!n)return;
  h.name=n;
  save();
  render();
}

function journeyStartDate(){
  if(data.journeyStart) return data.journeyStart;
  const candidates=[today()];
  data.habits.forEach(h=>{if(h.created)candidates.push(h.created)});
  Object.keys(data.checks||{}).forEach(k=>{const d=k.split("|")[1];if(d)candidates.push(d)});
  data.journeyStart=candidates.sort()[0]||today();
  save();
  return data.journeyStart;
}
function journeyCalendarDay(){
  const start=new Date(journeyStartDate()+"T12:00:00");
  const now=new Date(today()+"T12:00:00");
  return Math.max(1,Math.floor((now-start)/86400000)+1);
}

function journeyDay(h){
  return Math.max(1,streakRunFor(h));
}
function personalScore(){
  if(!data.habits.length)return 0;
  const s=stats();
  const week=s.score;
  const todayPct=Math.round(s.todayDone/data.habits.length*100);
  const streakBonus=Math.min(20,s.fullStreak*2);
  return Math.min(100,Math.round(todayPct*.35+week*.45+streakBonus));
}
function nextMilestone(day){
  const ms=[3,7,14,21,30,45,60,90,100,150,180,365];
  return ms.find(x=>x>day)||Math.ceil((day+1)/100)*100;
}
function focusHabit(){
  if(!data.habits.length)return null;
  // Pick a habit that is unfinished today; prefer the smallest current streak.
  const open=data.habits.filter(h=>!done(h,today()));
  return (open.length?open:data.habits).slice().sort((a,b)=>streakRunFor(a)-streakRunFor(b))[0];
}
function todayReflection(){
  const s=stats();
  if(s.todayDone===0)return ["Start","What's the easiest win you can complete in 2 minutes?","A tiny start is enough."];
  if(s.todayDone===data.habits.length)return ["Celebrate","What worked today that you can repeat tomorrow?","Keep the successful routine visible."];
  return ["Adjust","What got in the way of the remaining habit?","Make tomorrow's next action smaller or clearer."];
}
function weekDays(){
  const all=allStoredDates();
  return all.slice(-7);
}

function dayMessage(day){
  if(DAY_MESSAGES[day]) return DAY_MESSAGES[day];
  if(day>100) return [`🔥 Day ${day} — Keep Building`,`You are ${day} days into this journey. Use your progress as feedback and keep the next step realistic.`,`Consistency is built one day at a time.`];
  if(day>90) return [`🚀 Day ${day} — Keep Going`,`You're past 90 days. Review what is working and keep the habits that genuinely fit your life.`,`Progress grows through repetition and adjustment.`];
  if(day>60) return [`💪 Day ${day} — Stay Sustainable`,`You've built a long streak. Protect it by keeping the routine realistic on busy days.`,`Strong routines can bend without breaking.`];
  if(day>45) return [`🔥 Day ${day} — Keep The System`,`You're well into the journey. Use your tracker to spot what helps you stay consistent.`,`Data → insight → next action.`];
  if(day>30) return [`🌱 Day ${day} — Build The Next Month`,`30 days are behind you. Now turn what you learned into a routine you can keep improving.`,`The next chapter is about sustainability.`];
  return [`🔥 Day ${day} — Keep Showing Up`,`Every completed day gives you more information about what works for you. Keep the next action simple.`,`One more honest win today.`];
}
function journeyMilestones(day){
  return [1,3,7,14,21,30,45,60,90,100].map(n=>`<div class="milestone ${day>=n?"on":""}"><b>${day>=n?"✓":"·"}</b>Day ${n}</div>`).join("");
}
function streakRecovery(h){
  const hs=habitStats(h);
  if(hs.run===0) return "Restart mode: pick the easiest version of this habit today.";
  if(hs.run<3) return "You're rebuilding momentum. Protect the next small win.";
  if(hs.run<7) return "Momentum is growing. Keep today's action easy to repeat.";
  return "Strong momentum. Protect the routine, not just the number.";
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    tab=b.dataset.tab;
    selectedHabit=null;
    render();
  });

  $("#dark")?.addEventListener("click",()=>{data.dark=!data.dark;save();render()});

  $("#quickBackup")?.addEventListener("click",()=>$("#backup")?.click());

  $("#backup")?.addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="progress-tracker-v8.1-backup.json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  $("#restoreBtn")?.addEventListener("click",()=>$("#restore")?.click());
  $("#restore")?.addEventListener("change",e=>{
    const f=e.target.files?.[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{data=normalize(JSON.parse(r.result));data.onboardingDone=true;save();render();showToast("Backup restored ✅")}
      catch(err){alert("Could not restore that file.")}
    };
    r.readAsText(f);
  });

  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const [hid,d]=b.dataset.toggle.split("|"),h=data.habits.find(x=>x.id===hid); if(h)toggle(h,d);
  });
  document.querySelectorAll("[data-freeze]").forEach(b=>b.onclick=()=>{
    const [hid,d]=b.dataset.freeze.split("|"),h=data.habits.find(x=>x.id===hid); if(h)useFreeze(h,d);
  });
  document.querySelectorAll("[data-openhabit]").forEach(b=>b.onclick=()=>{
    selectedHabit=b.dataset.openhabit;render();
  });

  $("#closeHabit")?.addEventListener("click",()=>{selectedHabit=null;render()});
  $("#habitOverlay")?.addEventListener("click",e=>{if(e.target.id==="habitOverlay"){selectedHabit=null;render()}});

  $("#saveHabitNote")?.addEventListener("click",()=>{
    const h=data.habits.find(x=>x.id===selectedHabit); if(!h)return;
    data.notes[h.id]=$("#habitNote").value;save();showToast("Habit note saved ✅");render();
  });
  $("#editThisHabit")?.addEventListener("click",()=>{
    const h=data.habits.find(x=>x.id===selectedHabit); if(h)editHabit(h);
  });
  $("#deleteThisHabit")?.addEventListener("click",()=>{
    const h=data.habits.find(x=>x.id===selectedHabit); if(h)removeHabit(h);
  });

  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    addHabit(b.dataset.preset,b.dataset.picon,b.dataset.private==="1");
    render();
  });
  $("#addCustom")?.addEventListener("click",()=>{
    const v=$("#customHabit").value.trim();
    if(addHabit(v,iconFor(v),false)){ $("#customHabit").value=""; showToast("Habit added ✅"); render(); }
  });
  $("#customHabit")?.addEventListener("keydown",e=>{if(e.key==="Enter")$("#addCustom")?.click()});


  $("#monthPicker")?.addEventListener("change",e=>{data.month=e.target.value||currentMonth();save();render();});

  $("#saveGoal")?.addEventListener("click",()=>{
    data.goal=$("#goal").value.trim();
    data.target=Math.max(1,Number($("#target").value||7));
    data.achieved=Math.max(0,Number($("#achieved").value||0));
    save();showToast("Goal saved 🎯");render();
  });
  $("#saveReview")?.addEventListener("click",()=>{
    data.win=$("#win").value;
    data.barrier=$("#barrier").value;
    data.ifThen=$("#ifThen").value;
    save();showToast("Review saved 🧠");render();
  });
  $("#saveSleep")?.addEventListener("click",()=>{
    const d=today();
    data.sleep[d]={hours:Number($("#sleepHours").value||0),bed:$("#bed").value,wake:$("#wake").value};
    save();showToast("Sleep saved 😴");render();
  });
  $("#saveDailyNote")?.addEventListener("click",()=>{
    data.notes[today()]=$("#dailyNote").value;save();showToast("Journal saved ✍️");render();
  });
  $("#openChallenge")?.addEventListener("click",()=>{
    const easiest=data.habits.find(h=>habitStats(h).run===Math.min(...data.habits.map(x=>habitStats(x).run)));
    if(easiest){selectedHabit=easiest.id;render()}
  });

  document.querySelectorAll("[data-onpreset]").forEach(b=>{
    b.onclick=()=>{
      const cb=b.querySelector("input");
      cb.checked=!cb.checked;
      b.classList.toggle("selected",cb.checked);
      updateSelCount();
    };
    const cb=b.querySelector("input");
    if(cb) cb.onclick=(e)=>{
      e.stopPropagation();
      b.classList.toggle("selected",cb.checked);
      updateSelCount();
    };
  });
  $("#onAddCustom")?.addEventListener("click",()=>{
    const v=$("#onCustom").value.trim();
    if(!v)return;
    const exists=[...document.querySelectorAll("[data-oncustom-extra]")].some(x=>x.textContent.trim().toLowerCase()===v.toLowerCase());
    if(exists)return;
    const wrap=document.createElement("div");
    wrap.dataset.oncustomExtra="1";
    wrap.className="note";
    wrap.style.marginTop="7px";
    wrap.innerHTML=`✅ ${esc(v)} <span class="muted">(will be added)</span>`;
    $("#onCustom").parentElement.parentElement.appendChild(wrap);
    $("#onCustom").value="";
    showToast("Custom habit added to setup");
  });
  $("#finishOnboarding")?.addEventListener("click",finishOnboarding);
  updateSelCount();
}

function updateSelCount(){
  const wrap=$("#onPresets");
  if(!wrap)return;
  const n=wrap.querySelectorAll("input:checked").length+(document.querySelector("[data-onpreset][data-private='1'] input:checked")?.checked?1:0);
  const el=$("#selCount");if(el)el.textContent=n+" selected";
}

function finishOnboarding(){
  const name=$("#onName").value.trim();
  if(!name){alert("Please enter your name.");return}
  const chosen=[];
  document.querySelectorAll("[data-onpreset]").forEach(b=>{
    const cb=b.querySelector("input");
    if(cb?.checked) chosen.push({name:b.dataset.onpreset,icon:b.dataset.picon,private:b.dataset.private==="1"});
  });
  document.querySelectorAll("[data-oncustom-extra]").forEach(el=>{
    const v=el.textContent.replace("✅ ","").replace(" (will be added)","").trim();
    if(v)chosen.push({name:v,icon:iconFor(v),private:false});
  });
  if(!chosen.length){alert("Select at least one habit.");return}
  data.name=name;
  data.habits=[];
  chosen.slice(0,15).forEach(x=>data.habits.push({id:uid(),name:x.name,icon:x.icon,private:!!x.private,created:currentMonth()}));
  data.onboardingDone=true;
  data.xp=0;
  save();
  showToast("Routine saved 🚀");
  render();
}

render();
})();
</script>
</body>
</html>
