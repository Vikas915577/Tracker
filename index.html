<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3da35d">
<meta name="description" content="Winter Arc Tracker V26.0 — mobile-first habit tracker with private ArcPilot habit insights.">
<meta name="application-name" content="Winter Arc Tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winter Arc Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Winter Arc Tracker V26.0</title>
<link rel="stylesheet" href="styles.css">
<script src="cloud-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="v25-overrides.css">
<link rel="stylesheet" href="v26-arcpilot.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<noscript>This website needs JavaScript to run. Please enable JavaScript in your browser.</noscript>
<script>
(function(){
  const assetNames=new Set(['creator-profile.jpg','creator-photo-1.jpg','creator-photo-2.jpg','creator-photo-3.jpg','icon-192.png','icon-512.png']);
  const original='https://raw.githubusercontent.com/Vikas915577/Tracker/main/';
  document.addEventListener('error',function(event){
    const el=event.target;
    if(!(el instanceof HTMLImageElement || el instanceof HTMLLinkElement)) return;
    const raw=el instanceof HTMLLinkElement ? el.getAttribute('href') : el.getAttribute('src');
    if(!raw) return;
    const file=raw.split('/').pop().split('?')[0];
    if(!assetNames.has(file) || el.dataset.originalAssetFallback==='1') return;
    el.dataset.originalAssetFallback='1';
    event.stopImmediatePropagation();
    if(el instanceof HTMLLinkElement) el.href=original+file; else el.src=original+file;
  },true);
})();
</script>
<script src="app.js"></script>
<script src="arcpilot.js"></script>
</body>
</html>
