<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#635bff">
<title>Progress Tracker V9</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e5e9f1;
  --accent:#635bff;--accent2:#8b5cf6;--good:#16a34a;--warn:#f59e0b;--bad:#ef4444;
  --soft:#efefff;--soft2:#f0fdf4;--shadow:0 10px 30px rgba(22,28,52,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body.dark{--bg:#0b1220;--card:#141c2e;--text:#f4f7ff;--muted:#9aa8c0;--line:#29344b;--soft:#202846;--soft2:#153521;--shadow:0 10px 30px rgba(0,0,0,.24)}

button{cursor:pointer}

.app{max-width:1060px;margin:auto;padding:12px 12px 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 10px}
.title h1{margin:0;font-size:22px;letter-spacing:-.02em}.title p{margin:2px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{min-height:34px;padding:7px 9px;font-size:12px}.btn.block{width:100%}
.icon-btn{width:40px;min-width:40px;padding:0;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.section h2{margin:0;font-size:17px;letter-spacing:-.01em}
.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:4px;background:var(--soft);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700}
.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.form label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}

.tabs{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:3px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:70}.dark .bottom{background:rgba(20,28,46,.97)}
.bottom button{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:13px;font-size:10px;min-width:62px}.bottom button.active{background:var(--soft);color:var(--accent);font-weight:800}
.hero{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid rgba(99,91,255,.35);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:var(--accent);opacity:.08}
.hero-flex{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1}.hero-copy{flex:1}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:900}.hero h2{margin:4px 0 6px;font-size:22px;letter-spacing:-.025em}.hero p{margin:0;color:var(--muted);line-height:1.45;font-size:13px}
.score-ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:conic-gradient(var(--accent) calc(var(--score)*1%),var(--line) 0)}.score-ring span{width:80px;height:80px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}.score-ring b{font-size:25px;line-height:1}.score-ring small{font-size:10px;color:var(--muted)}
.quick-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
.stats-grid{grid-template-columns:repeat(4,1fr)}.stat{background:var(--soft);border-radius:15px;padding:11px}.stat small{color:var(--muted);font-size:10px}.stat b{display:block;font-size:19px;margin-top:4px}
.focus{border:2px solid var(--accent);background:linear-gradient(135deg,var(--soft),var(--card))}.focus-row{display:flex;align-items:center;gap:10px}.focus-icon{font-size:32px}.focus-copy{flex:1}.habit-title{font-weight:900;font-size:15px}.focus-action{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}.focus-check{width:54px;height:54px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-size:24px}.focus-check.done{background:var(--good)}
.motive{background:linear-gradient(135deg,var(--soft),var(--card))}.motive-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.motive-title h2{margin:0;font-size:17px}.motive-msg{font-size:14px;line-height:1.5;margin:8px 0}
.challenge{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--accent);padding:11px;border-radius:14px;background:var(--card)}.challenge b{display:block}.challenge span{color:var(--muted);font-size:12px}
.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:118px;align-items:end}.wbar{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px;height:100%}.wbar .barfill{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:5px}.wbar small{font-size:9px;color:var(--muted)}
.day-journey{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid rgba(99,91,255,.33)}.journey-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.day-badge{background:var(--accent);color:#fff;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900}.quote{font-size:16px;line-height:1.45;font-weight:850;margin:8px 0}.subquote{font-size:12px;color:var(--muted)}.milestones{display:flex;gap:6px;overflow:auto;margin-top:10px;padding-bottom:2px}.milestone{min-width:64px;padding:7px 6px;border:1px solid var(--line);border-radius:12px;text-align:center;background:var(--card);font-size:9px}.milestone b{display:block;font-size:15px}.milestone.on{background:var(--soft);border-color:var(--accent)}
.habit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.habit-card{border:1px solid var(--line);border-radius:17px;padding:12px;background:var(--card)}.habit-head{display:flex;gap:9px;align-items:flex-start}.habit-icon{font-size:27px;line-height:1}.habit-card .habit-title{font-size:15px}.habit-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.habit-meta span{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:10px}.habit-actions{display:flex;gap:6px;margin-top:9px}.habit-actions .btn{flex:1}.habit-done{background:var(--good)!important;border-color:var(--good)!important;color:#fff!important}
.calendar7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}.calday{text-align:center}.calday small{display:block;font-size:8px;color:var(--muted);margin-bottom:3px}.dot{height:26px;border-radius:8px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px}.dot.on{background:var(--good);color:#fff}.dot.today{outline:2px solid var(--accent);outline-offset:-2px}
.matrix-wrap{overflow:auto;-webkit-overflow-scrolling:touch}.matrix{min-width:720px;border-collapse:separate;border-spacing:4px;width:100%}.matrix th{font-size:9px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--card);z-index:2}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--card);z-index:3}.matrix td{height:36px;text-align:center}.matrix .habit-cell{text-align:left;min-width:160px;padding:7px;font-size:11px;font-weight:800}.daycheck{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:transparent}.daycheck.done{background:var(--good);border-color:var(--good);color:#fff}.daycheck.freeze{background:var(--warn);border-color:var(--warn);color:#fff}.daycheck.today{outline:2px solid var(--accent);outline-offset:-2px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat div{aspect-ratio:1;border-radius:7px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}.heat div.on{background:var(--accent);color:#fff}.heat div.today{outline:2px solid var(--accent)}
.achievement{display:inline-flex;align-items:center;gap:5px;background:var(--soft);padding:7px 9px;border-radius:10px;font-size:11px;margin:3px}.achievement.locked{opacity:.65}.recovery{background:rgba(245,158,11,.07);border:1px dashed var(--warn)}.note{background:var(--soft);padding:10px;border-radius:12px;font-size:12px;line-height:1.45}.success{color:var(--good);font-weight:800}.private-pill{background:#fff4e8!important;color:#a15c00!important}.dark .private-pill{background:#352714!important;color:#ffd28a!important}
.overlay{position:fixed;inset:0;background:rgba(7,14,28,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:100}.modal{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:17px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);margin:5px 0 13px}.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.preset{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:10px;text-align:left}.preset.selected{border-color:var(--accent);background:var(--soft)}.preset .line{display:flex;gap:9px;align-items:center}.preset input{width:auto}.custom-row{display:flex;gap:7px}.custom-row input{flex:1}.private-section{margin-top:12px}
.drawer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.more-tile{border:1px solid var(--line);border-radius:16px;padding:13px;background:var(--card)}.more-tile b{display:block;font-size:14px}.more-tile span{font-size:22px}.more-tile small{display:block;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;z-index:130;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90%;white-space:nowrap}.spark{position:fixed;pointer-events:none;z-index:140;font-size:24px;animation:spark .9s ease-out forwards}@keyframes spark{0%{transform:translate(0,0) scale(.8);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-120px) scale(1.2);opacity:0}}
.pulse{animation:pulse 1.7s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(99,91,255,0)}50%{box-shadow:0 0 0 7px rgba(99,91,255,.08)}}
.smalltext{font-size:11px}.empty{text-align:center;padding:18px;color:var(--muted)}
@media(max-width:760px){.app{padding:10px 10px 104px}.top{padding-top:2px}.title h1{font-size:20px}.hero-flex{align-items:flex-start}.score-ring{width:84px;height:84px}.score-ring span{width:64px;height:64px}.score-ring b{font-size:21px}.hero h2{font-size:19px}.stats-grid{grid-template-columns:repeat(2,1fr)}.stats-grid .stat:last-child{grid-column:span 2}.form,.three,.two{grid-template-columns:1fr}.habit-grid{grid-template-columns:1fr}.preset-grid{grid-template-columns:1fr}.drawer-grid{grid-template-columns:1fr}.top .actions .btn:not(.icon-btn){display:none}}
@media(min-width:761px){.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs .btn{border-radius:11px}.bottom{display:none}}
@media(print){.bottom,.actions,.tabs{display:none!important}.app{padding-bottom:8px}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

const KEY='progress_tracker_v9';
const OLD_KEYS=['progress_tracker_v8','progress_tracker_v6','progress_tracker_v5','progress_tracker_v4','progress_tracker_v3_plain'];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const currentMonth=()=>today().slice(0,7);
const daysInMonth=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const makeDays=m=>Array.from({length:daysInMonth(m)},(_,i)=>m+'-'+String(i+1).padStart(2,'0'));
const localDate=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dateFromKey=d=>new Date(d+'T12:00:00');
const addDays=(d,n)=>{const x=dateFromKey(d);x.setDate(x.getDate()+n);return localDate(x)};
const dateDiff=(a,b)=>Math.round((dateFromKey(b)-dateFromKey(a))/86400000);

const PRESETS=[
  {name:'Exercise',icon:'🏃',cat:'Health',difficulty:'Medium',action:'5 minutes of movement'},
  {name:'Study / Work',icon:'📚',cat:'Focus',difficulty:'Hard',action:'10 minutes of focused work'},
  {name:'Drink Water',icon:'💧',cat:'Health',difficulty:'Easy',action:'Drink 1 glass now'},
  {name:'Read',icon:'📖',cat:'Mind',difficulty:'Easy',action:'Read 2 pages'},
  {name:'Meditation',icon:'🧘',cat:'Mind',difficulty:'Easy',action:'2 minutes of breathing'},
  {name:'Sleep on Time',icon:'😴',cat:'Health',difficulty:'Medium',action:'Start a wind-down routine'},
  {name:'Walk',icon:'🚶',cat:'Health',difficulty:'Easy',action:'5 minutes of walking'},
  {name:'Healthy Food',icon:'🥗',cat:'Health',difficulty:'Medium',action:'Make one healthy choice'},
  {name:'Less Phone',icon:'📵',cat:'Focus',difficulty:'Medium',action:'Keep phone away for 15 min'},
  {name:'Masturbation',icon:'🔒',cat:'Private',private:true,difficulty:'Medium',action:'Follow your chosen boundary'}
];

function defaults(){return {
  name:'',month:currentMonth(),habits:[],checks:{},freezes:{},freezeUsed:{},sleep:{},notes:{},habitNotes:{},
  goal:'',target:7,achieved:0,win:'',barrier:'',ifThen:'',dark:false,xp:0,onboardingDone:false,journeyStart:''
}}
let data=load();
let tab='home';
let selectedHabit=null;
let toastTimer=null;
let customSetup=[];
let morePanel='';

function load(){
  try{
    const cur=JSON.parse(localStorage.getItem(KEY)||'null');
    if(cur)return normalize(cur);
    for(const k of OLD_KEYS){
      const old=JSON.parse(localStorage.getItem(k)||'null');
      if(old){const m=normalize(old);m.onboardingDone=!!m.name;saveObj(m);return m;}
    }
  }catch(e){}
  return defaults();
}
function normalize(x){
  const d=Object.assign(defaults(),x||{});
  if(!Array.isArray(d.habits))d.habits=[];
  d.habits=d.habits.map(h=>typeof h==='string'?{id:uid(),name:h,icon:'✅',private:false,created:currentMonth(),difficulty:'Medium',action:'Do the smallest useful version'}:Object.assign({id:uid(),name:'Habit',icon:'✅',private:false,created:currentMonth(),difficulty:'Medium',action:'Do the smallest useful version'},h)).filter(h=>h.name);
  ['checks','freezes','freezeUsed','sleep','notes','habitNotes'].forEach(k=>{if(!d[k]||typeof d[k]!=='object')d[k]={}});
  if(!d.month||!/^[0-9]{4}-[0-9]{2}$/.test(d.month))d.month=currentMonth();
  d.xp=Number(d.xp)||0;d.target=Number(d.target)||7;d.achieved=Number(d.achieved)||0;
  return d;
}
function saveObj(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function save(){saveObj(data)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function key(h,d){return h.id+'|'+d}
function done(h,d){return !!data.checks[key(h,d)]}
function frozen(h,d){return !!data.freezes[key(h,d)]}
function active(h,d){return done(h,d)||frozen(h,d)}
function showToast(msg){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);toastTimer=setTimeout(()=>e.remove(),1900)}
function celebrate(){['✨','🔥','🎉','💪','⭐'].forEach((e,i)=>{const el=document.createElement('div');el.className='spark';el.textContent=e;el.style.left=(40+Math.random()*20)+'%';el.style.bottom=(90+Math.random()*35)+'px';el.style.setProperty('--dx',((Math.random()-.5)*180)+'px');document.body.appendChild(el);setTimeout(()=>el.remove(),850+i*40)})}
function addXp(n){data.xp=(data.xp||0)+n;save()}
function level(){return Math.floor((data.xp||0)/100)+1}
function xpToNext(){return (data.xp||0)%100}

function toggle(h,d){
  const k=key(h,d),was=done(h,d);
  if(frozen(h,d))delete data.freezes[k];
  if(!was){
    data.checks[k]=true;addXp(10);showToast('Nice! +10 XP 🔥');celebrate();
    if(d===today()&&data.habits.length&&data.habits.every(x=>done(x,d)))showToast('Today complete! 🎉 +10 XP');
  }else{delete data.checks[k];save();showToast('Check removed')}
  render();
}
function freezeMonthKey(){return currentMonth()}
function freezeAvailable(){return !data.freezeUsed[freezeMonthKey()]}
function useFreeze(h,d){
  const k=key(h,d);if(done(h,d))return;
  if(frozen(h,d)){delete data.freezes[k];delete data.freezeUsed[freezeMonthKey()];save();render();showToast('Freeze removed 🛡️');return}
  if(!freezeAvailable()){showToast('This month\'s freeze is already used 🛡️');return}
  data.freezes[k]=true;data.freezeUsed[freezeMonthKey()]=true;save();showToast('Monthly Streak Freeze used 🛡️');render();
}
function allStoredDates(){
  const set=new Set([today()]);
  Object.keys(data.checks).forEach(k=>{const d=k.split('|')[1];if(/^\d{4}-\d{2}-\d{2}$/.test(d))set.add(d)});
  Object.keys(data.freezes).forEach(k=>{const d=k.split('|')[1];if(/^\d{4}-\d{2}-\d{2}$/.test(d))set.add(d)});
  Object.keys(data.sleep).forEach(d=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d))set.add(d)});
  Object.keys(data.notes).forEach(d=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d))set.add(d)});
  const first=data.habits.reduce((m,h)=>h.created&&h.created<m?h.created:m,today());if(first)set.add(first);
  const arr=[...set].sort();const start=arr[0]||today();const span=Math.max(1,dateDiff(start,today())+1);const n=Math.min(3650,Math.max(span,365));
  return Array.from({length:n},(_,i)=>addDays(today(),i-(n-1)));
}
function habitStats(h){
  const all=allStoredDates(),md=makeDays(data.month),last7=all.slice(-7);
  let run=0,longest=0,cur=0;
  for(let i=all.length-1;i>=0;i--){const d=all[i];if(active(h,d))run++;else if(d===today())continue;else break}
  all.forEach(d=>{if(active(h,d)){cur++;longest=Math.max(longest,cur)}else cur=0});
  const total=all.filter(d=>done(h,d)).length;
  const weekDone=last7.filter(d=>active(h,d)).length;
  const monthDone=md.filter(d=>done(h,d)).length;
  const eligible=md.filter(d=>d>=(h.created||md[0])&&d<=today()).length||1;
  return {run,longest,total,weekDone,monthDone,weekPct:Math.round(weekDone/7*100),monthPct:Math.round(monthDone/eligible*100)};
}
function stats(){
  const md=makeDays(data.month).filter(d=>d<=today()),all=allStoredDates();
  const total=data.habits.length*md.length;let completed=0;md.forEach(d=>data.habits.forEach(h=>{if(done(h,d))completed++}));
  const todayDone=data.habits.filter(h=>done(h,today())).length;
  let full=0;for(let i=all.length-1;i>=0;i--){const d=all[i];if(data.habits.length&&data.habits.every(h=>active(h,d)))full++;else if(d===today())continue;else break}
  let longest=0,cur=0;all.forEach(d=>{if(data.habits.length&&data.habits.every(h=>active(h,d))){cur++;longest=Math.max(longest,cur)}else cur=0});
  let bestH=null,best=0;data.habits.forEach(h=>{const n=habitStats(h).total;if(n>best){best=n;bestH=h}});
  const sleep=md.map(d=>Number(data.sleep[d]?.hours)).filter(Boolean);const avg=sleep.length?sleep.reduce((a,b)=>a+b,0)/sleep.length:0;
  return {total,completed,pct:total?Math.round(completed/total*100):0,todayDone,fullStreak:full,longest,bestH,best,avg,score:weeklyScore()};
}
function activeCount(d){return data.habits.filter(h=>active(h,d)).length}
function checkedCount(d){return data.habits.filter(h=>done(h,d)).length}
function weeklyScore(){const ds=allStoredDates().slice(-7);const total=Math.max(1,data.habits.length*ds.length);return data.habits.length?Math.round(ds.reduce((a,d)=>a+activeCount(d),0)/total*100):0}
function personalScore(){if(!data.habits.length)return 0;const s=stats();return Math.min(100,Math.round((s.todayDone/data.habits.length*100)*.35+s.score*.45+Math.min(20,s.fullStreak*2)))}
function journeyStartDate(){
  if(data.journeyStart&&/^\d{4}-\d{2}-\d{2}$/.test(data.journeyStart))return data.journeyStart;
  const c=[today(),...data.habits.map(h=>h.created).filter(Boolean),...Object.keys(data.checks).map(k=>k.split('|')[1])].filter(Boolean).sort();
  data.journeyStart=c[0]||today();save();return data.journeyStart;
}
function journeyCalendarDay(){return Math.max(1,dateDiff(journeyStartDate(),today())+1)}
function nextMilestone(day){const ms=[3,7,14,21,30,45,60,90,100,150,180,365];return ms.find(n=>n>day)||Math.ceil((day+1)/100)*100}
function focusHabit(){
  if(!data.habits.length)return null;const open=data.habits.filter(h=>!done(h,today()));return (open.length?open:data.habits).slice().sort((a,b)=>habitStats(a).run-habitStats(b).run)[0]
}
function streakRecovery(h){const r=habitStats(h).run;if(r===0)return 'Restart mode: pick the easiest version of this habit today.';if(r<3)return 'You\'re rebuilding momentum. Protect the next small win.';if(r<7)return 'Momentum is growing. Keep today\'s action easy to repeat.';return 'Strong momentum. Protect the routine, not just the number.'}

function achievements(){

}
function iconFor(name){return PRESETS.find(p=>p.name.toLowerCase()===name.toLowerCase())?.icon||'✅'}

function addHabit(name,icon='✅',priv=false,difficulty='Medium',action='Do the smallest useful version'){

  const p=presetFor(n);data.habits.push({id:uid(),name:n,icon:p?.icon||icon,private:!!priv,created:currentMonth(),difficulty:difficulty||p?.difficulty||'Medium',action:action||p?.action||'Do the smallest useful version'});save();return true
}
function removeHabit(h){if(!confirm('Delete this habit and its history?'))return;data.habits=data.habits.filter(x=>x.id!==h.id);Object.keys(data.checks).forEach(k=>{if(k.startsWith(h.id+'|'))delete data.checks[k]});Object.keys(data.freezes).forEach(k=>{if(k.startsWith(h.id+'|'))delete data.freezes[k]});delete data.habitNotes[h.id];if(selectedHabit===h.id)selectedHabit=null;save();render()}

function morePage(){return `
  <section class="card hero"><div class="kicker">MORE</div><h2 style="margin:4px 0 6px">Everything else, without clutter.</h2><p class="muted" style="margin:0">Goals, reflection, sleep, journal, backup and settings live here.</p></section>
  <section class="drawer-grid"><button class="more-tile" data-more="goals"><span>🎯</span><b>Goals & review</b><small>Set a target and reflect on the week.</small></button><button class="more-tile" data-more="sleep"><span>😴</span><b>Sleep</b><small>Log hours, bedtime and wake time.</small></button><button class="more-tile" data-more="journal"><span>✍️</span><b>Daily journal</b><small>One line is enough.</small></button><button class="more-tile" data-more="settings"><span>⚙️</span><b>Settings</b><small>Dark mode, backup and restore.</small></button></section>
  ${morePanel?morePanelHtml():'<section class="card"><div class="section"><h2>💾 Data safety</h2><span class="badge">Recommended</span></div><div class="note">Backup before clearing browser data or switching devices. Restore lets you bring your progress back from a JSON file.</div></section>'}`}
function morePanelHtml(){if(morePanel==='goals')return goalsHtml();if(morePanel==='sleep')return sleepHtml();if(morePanel==='journal')return journalHtml();return settingsHtml()}
function goalsHtml(){return `<section class="card"><div class="section"><h2>🎯 Monthly goal</h2><button class="btn small" data-close-more>Close</button></div><div class="form"><div><label>Goal</label><input id="goal" value="${esc(data.goal)}" placeholder="e.g. Exercise 20 days"></div><div><label>Target</label><input id="target" type="number" min="1" max="31" value="${data.target}"></div><div><label>Achieved</label><input id="achieved" type="number" min="0" max="31" value="${data.achieved}"></div></div><button class="btn primary" id="saveGoal" style="margin-top:9px">Save goal 🎯</button><div style="margin-top:11px;display:flex;align-items:center;gap:8px"><b>${data.achieved}/${data.target}</b><div class="progress" style="flex:1"><i style="width:${Math.min(100,Math.round(data.achieved/Math.max(1,data.target)*100))}%"></i></div></div></section><section class="card"><div class="section"><h2>🧠 Weekly reflection</h2><span class="muted smalltext">Feedback → next action</span></div><div class="form"><div><label>What went well?</label><textarea id="win">${esc(data.win)}</textarea></div><div><label>What got in the way?</label><textarea id="barrier">${esc(data.barrier)}</textarea></div><div><label>My If–Then plan</label><textarea id="ifThen">${esc(data.ifThen)}</textarea></div></div><button class="btn primary" id="saveReview" style="margin-top:9px">Save review</button></section>`}
function sleepHtml(){const d=today(),o=data.sleep[d]||{};return `<section class="card"><div class="section"><h2>😴 Sleep</h2><button class="btn small" data-close-more>Close</button></div><p class="muted smalltext">Optional daily log.</p><div class="form"><div><label>Hours</label><input id="sleepHours" type="number" min="0" max="24" step="0.1" value="${esc(o.hours||'')}"></div><div><label>Bedtime</label><input id="bed" type="time" value="${esc(o.bed||'')}"></div><div><label>Wake time</label><input id="wake" type="time" value="${esc(o.wake||'')}"></div></div><button class="btn primary" id="saveSleep" style="margin-top:9px">Save sleep</button></section>`}
function journalHtml(){const d=today();return `<section class="card"><div class="section"><h2>✍️ Daily journal</h2><button class="btn small" data-close-more>Close</button></div><p class="muted smalltext">One line is enough.</p><textarea id="dailyNote" placeholder="How was today?">${esc(data.notes[d]||'')}</textarea><button class="btn primary" id="saveDailyNote" style="margin-top:9px">Save note</button></section>`}
function settingsHtml(){return `<section class="card"><div class="section"><h2>⚙️ Settings</h2><button class="btn small" data-close-more>Close</button></div><div class="quick-actions"><button class="btn" id="dark2">${data.dark?'☀️ Light mode':'🌙 Dark mode'}</button><button class="btn" id="backup2">💾 Backup</button><button class="btn" id="restoreBtn">📥 Restore</button><input id="restore" type="file" accept=".json" hidden></div><div class="note" style="margin-top:10px">Backup filename: progress-tracker-v9-backup.json</div></section>`}
function onboarding(){return `<div class="overlay" id="onboardingOverlay"><div class="modal"><div class="kicker">V9 Setup</div><h2>👋 Let's make your routine simple.</h2><p>Choose only the habits you really want to track. You can add or remove them later.</p><label class="muted smalltext">Your name</label><input id="onName" value="${esc(data.name)}" placeholder="Enter your name"><div class="section" style="margin-top:14px"><h2>Choose habits</h2><span class="badge" id="selCount">0 selected</span></div><div class="preset-grid" id="onPresets">${PRESETS.filter(p=>!p.private).map((p,i)=>`<button class="preset ${i<4?'selected':''}" data-onpreset="${esc(p.name)}" data-picon="${p.icon}" data-private="0"><div class="line"><input type="checkbox" ${i<4?'checked':''}><span style="font-size:22px">${p.icon}</span><div><b>${esc(p.name)}</b><div class="muted">${esc(p.cat)}</div></div></div></button>`).join('')}</div><div class="private-section"><div class="section"><h2>🔒 Private habit</h2><span class="muted smalltext">Optional</span></div><button class="preset" style="width:100%" data-onpreset="Masturbation" data-picon="🔒" data-private="1"><div class="line"><input type="checkbox"><span style="font-size:22px">🔒</span><div><b>Masturbation</b><div class="muted">Discreet label in the app</div></div></div></button></div><div style="margin-top:12px"><label class="muted smalltext">Add your own habit</label><div class="custom-row" style="margin-top:6px"><input id="onCustom" placeholder="e.g. Stretch"><button class="btn" id="onAddCustom">Add</button></div><div id="setupCustomList" style="margin-top:7px"></div></div><div class="note" style="margin-top:12px">💡 Start with a small set you can realistically repeat. Small wins are easier to keep going.</div><button class="btn primary block" id="finishOnboarding" style="margin-top:13px;padding:12px">Save My Routine 🚀</button></div></div>`}
function habitDetailOverlay(){const h=data.habits.find(x=>x.id===selectedHabit);if(!h)return '';const hs=habitStats(h);const ds=makeDays(data.month);return `<div class="overlay" id="habitOverlay"><div class="modal"><div class="section"><div><div class="kicker">HABIT DETAILS</div><h2 style="margin-top:3px">${esc(h.icon)} ${esc(h.name)}</h2></div><button class="btn small" id="closeHabit">Close</button></div><div class="grid three"><div class="stat"><small>Current streak</small><b>${hs.run} 🔥</b></div><div class="stat"><small>Longest</small><b>${hs.longest}</b></div><div class="stat"><small>Total checks</small><b>${hs.total}</b></div></div><div class="form" style="margin-top:10px"><div><label>Icon</label><input id="habitIcon" value="${esc(h.icon)}" maxlength="3"></div><div><label>Difficulty</label><select id="habitDifficulty"><option ${h.difficulty==='Easy'?'selected':''}>Easy</option><option ${h.difficulty==='Medium'?'selected':''}>Medium</option><option ${h.difficulty==='Hard'?'selected':''}>Hard</option></select></div><div><label>Private label</label><select id="habitPrivate"><option value="0" ${!h.private?'selected':''}>No</option><option value="1" ${h.private?'selected':''}>Yes</option></select></div></div><div style="margin-top:10px"><label class="muted smalltext">Smallest useful action</label><input id="habitAction" value="${esc(h.action||'Do the smallest useful version')}"></div><div style="margin-top:10px"><label class="muted smalltext">Habit note</label><textarea id="habitNote" placeholder="Cue, reason, reminder...">${esc(data.habitNotes[h.id]||'')}</textarea></div><button class="btn primary block" id="saveHabitSettings" style="margin-top:10px">Save settings ✅</button><div class="section" style="margin-top:16px"><h2>📅 Month tracker</h2><span class="muted smalltext">${esc(data.month)}</span></div><div class="matrix-wrap"><table class="matrix"><thead><tr><th>Day</th>${ds.map(d=>`<th>${Number(d.slice(-2))}</th>`).join('')}</tr></thead><tbody><tr><td class="habit-cell">${esc(h.name)}</td>${ds.map(d=>`<td><button class="daycheck ${done(h,d)?'done':''} ${frozen(h,d)?'freeze':''} ${d===today()?'today':''}" data-toggle="${h.id}|${d}">${done(h,d)?'✓':frozen(h,d)?'🛡':''}</button></td>`).join('')}</tr></tbody></table></div><div class="habit-actions" style="margin-top:12px"><button class="btn" id="editThisHabit">Rename</button><button class="btn" id="deleteThisHabit">Delete</button></div><div class="note" style="margin-top:10px">🛡 Streak Freeze: ${freezeAvailable()?'Available this month':'Used this month'}. One freeze per month.</div></div></div>`}
function updateSelCount(){const wrap=$('#onPresets');if(!wrap)return;const n=wrap.querySelectorAll('input:checked').length+([...document.querySelectorAll('[data-onpreset][data-private="1"] input')].some(x=>x.checked)?1:0);$('#selCount').textContent=n+' selected'}
function finishOnboarding(){const name=$('#onName').value.trim();if(!name){alert('Please enter your name.');return}const chosen=[];document.querySelectorAll('[data-onpreset]').forEach(b=>{const cb=b.querySelector('input');if(cb?.checked){const p=presetFor(b.dataset.onpreset);chosen.push({name:b.dataset.onpreset,icon:b.dataset.picon,private:b.dataset.private==='1',difficulty:p?.difficulty||'Medium',action:p?.action||'Do the smallest useful version'})}});customSetup.forEach(n=>chosen.push({name:n,icon:iconFor(n),private:false,difficulty:'Medium',action:'Do the smallest useful version'}));if(!chosen.length){alert('Select at least one habit.');return}data.name=name;data.habits=[];chosen.slice(0,15).forEach(x=>data.habits.push({id:uid(),...x,created:currentMonth()}));data.onboardingDone=true;data.xp=0;data.journeyStart=currentMonth()+'-01';save();render();showToast('Routine saved 🚀')}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selectedHabit=null;morePanel='';render()});
  $('#dark')?.addEventListener('click',()=>{data.dark=!data.dark;save();render()});
  $('#backup')?.addEventListener('click',downloadBackup);
  $('#backup2')?.addEventListener('click',downloadBackup);
  $('#restoreBtn')?.addEventListener('click',()=>$('#restore')?.click());
  $('#restore')?.addEventListener('change',restoreBackup);
  $('#dark2')?.addEventListener('click',()=>{data.dark=!data.dark;save();render()});
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const [id,d]=b.dataset.toggle.split('|'),h=data.habits.find(x=>x.id===id);if(h)toggle(h,d)});
  document.querySelectorAll('[data-freeze]').forEach(b=>b.onclick=()=>{const [id,d]=b.dataset.freeze.split('|'),h=data.habits.find(x=>x.id===id);if(h)useFreeze(h,d)});
  document.querySelectorAll('[data-openhabit]').forEach(b=>b.onclick=()=>{selectedHabit=b.dataset.openhabit;render()});
  $('#closeHabit')?.addEventListener('click',()=>{selectedHabit=null;render()});
  $('#habitOverlay')?.addEventListener('click',e=>{if(e.target.id==='habitOverlay'){selectedHabit=null;render()}});
  $('#saveHabitSettings')?.addEventListener('click',()=>{const h=data.habits.find(x=>x.id===selectedHabit);if(h)saveHabitSettings(h)});
  $('#editThisHabit')?.addEventListener('click',()=>{const h=data.habits.find(x=>x.id===selectedHabit);if(h)editHabit(h)});
  $('#deleteThisHabit')?.addEventListener('click',()=>{const h=data.habits.find(x=>x.id===selectedHabit);if(h)removeHabit(h)});
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{addHabit(b.dataset.preset,b.dataset.picon,b.dataset.private==='1',b.dataset.difficulty,b.dataset.action);render();showToast('Habit added ✅')});
  $('#addCustom')?.addEventListener('click',()=>{const v=$('#customHabit').value.trim();if(addHabit(v,iconFor(v))){$('#customHabit').value='';render();showToast('Habit added ✅')}});
  $('#customHabit')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#addCustom')?.click()});
  $('#monthPicker')?.addEventListener('change',e=>{data.month=e.target.value||currentMonth();save();render()});
  $('#saveGoal')?.addEventListener('click',()=>{data.goal=$('#goal').value.trim();data.target=Math.max(1,Number($('#target').value||7));data.achieved=Math.max(0,Number($('#achieved').value||0));save();render();showToast('Goal saved 🎯')});
  $('#saveReview')?.addEventListener('click',()=>{data.win=$('#win').value;data.barrier=$('#barrier').value;data.ifThen=$('#ifThen').value;save();render();showToast('Review saved 🧠')});
  $('#saveSleep')?.addEventListener('click',()=>{const d=today();data.sleep[d]={hours:Number($('#sleepHours').value||0),bed:$('#bed').value,wake:$('#wake').value};save();render();showToast('Sleep saved 😴')});
  $('#saveDailyNote')?.addEventListener('click',()=>{data.notes[today()]=$('#dailyNote').value;save();render();showToast('Journal saved ✍️')});
  document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{morePanel=b.dataset.more;render()});
  document.querySelectorAll('[data-close-more]').forEach(b=>b.onclick=()=>{morePanel='';render()});
  document.querySelectorAll('[data-onpreset]').forEach(b=>{b.onclick=()=>{const cb=b.querySelector('input');cb.checked=!cb.checked;b.classList.toggle('selected',cb.checked);updateSelCount()};const cb=b.querySelector('input');cb.onclick=e=>{e.stopPropagation();b.classList.toggle('selected',cb.checked);updateSelCount()}});
  $('#onAddCustom')?.addEventListener('click',()=>{const v=$('#onCustom').value.trim();if(!v)return;if(customSetup.some(x=>x.toLowerCase()===v.toLowerCase()))return;customSetup.push(v);const row=document.createElement('div');row.className='note';row.textContent='✅ '+v;$('#setupCustomList').appendChild(row);$('#onCustom').value='';showToast('Custom habit added')});
  $('#finishOnboarding')?.addEventListener('click',finishOnboarding);updateSelCount();
}
function downloadBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progress-tracker-v9-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreBackup(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));data.onboardingDone=true;save();morePanel='';render();showToast('Backup restored ✅')}catch(err){alert('Could not restore that file.')}};r.readAsText(f)}

render();
})();
</script>
</body>
</html>
