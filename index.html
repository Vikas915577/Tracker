<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3da35d">
<meta name="description" content="Winter Arc Tracker — a mobile-first habit and progress tracker.">
<meta name="application-name" content="Winter Arc Tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winter Arc Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Winter Arc Tracker</title>
<link rel="stylesheet" href="styles.css">
<script src="cloud-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="v25-overrides.css">
</head>
<body>
<div id="app" aria-live="polite">
  <main style="max-width:520px;margin:20vh auto 0;padding:24px;text-align:center;color:#4d5a50;font:600 15px/1.5 system-ui,sans-serif">
    <div style="font-size:38px">❄️</div>
    <div>Opening Winter Arc Tracker…</div>
  </main>
</div>
<noscript>This website needs JavaScript to run. Please enable JavaScript in your browser.</noscript>

<script>
(function () {
  'use strict';
  function showBootError(message) {
    if (window.__WINTER_ARC_BOOTED === true) return;
    var mount = document.getElementById('app');
    if (!mount) return;
    mount.innerHTML =
      '<main style="max-width:520px;margin:12vh auto;padding:24px;font:14px/1.5 system-ui,sans-serif;color:#222">' +
        '<div style="font-size:38px">⚠️</div>' +
        '<h1 style="font-size:22px;margin:10px 0">Winter Arc could not start</h1>' +
        '<p>The website loaded, but the tracker script did not finish starting. Your saved progress has not been intentionally reset.</p>' +
        '<pre id="winter-arc-boot-error" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f1;padding:12px;border-radius:10px;color:#7b2828;font-size:12px"></pre>' +
        '<button id="winter-arc-reload" style="margin-top:14px;min-height:46px;padding:10px 16px;border:0;border-radius:12px;background:#318b4a;color:white;font-weight:800">Reload website</button>' +
        '<p style="font-size:12px;color:#68736a;margin-top:14px">Do not clear Chrome site storage or cookies; they may contain your saved progress.</p>' +
      '</main>';
    var detail = document.getElementById('winter-arc-boot-error');
    if (detail) detail.textContent = message || 'The app script did not render a screen.';
    var reload = document.getElementById('winter-arc-reload');
    if (reload) reload.addEventListener('click', function () { location.reload(); });
  }

  window.addEventListener('error', function (event) {
    if (window.__WINTER_ARC_BOOTED === true) return;
    var filename = String(event.filename || '');
    var message = String(event.message || '');
    if (/app\.js/i.test(filename) || /SyntaxError|Unexpected end of input/i.test(message)) {
      setTimeout(function () {
        if (window.__WINTER_ARC_BOOTED !== true) showBootError(message || 'The tracker script failed to execute.');
      }, 50);
    }
  }, true);

  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.__WINTER_ARC_BOOTED !== true) {
        showBootError('The tracker did not finish rendering within 12 seconds. Check the published JavaScript bundle and service-worker cache.');
      }
    }, 12000);
  });
})();
</script>
<script src="app.js"></script>
</body>
</html>
