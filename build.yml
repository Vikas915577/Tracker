name: Winter Arc V26 Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: winter-arc-pages
  cancel-in-progress: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical website source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s arcpilot.js
          test -s cloud-config.js
          test -s styles.css
          test -s v25-overrides.css
          test -s v26-arcpilot.css
          test -s sw.js
          test -s manifest.json
          node --check app.js
          node --check arcpilot.js
          node --check sw.js
          python3 scripts/verify_web_bundle.py --site . --allow-v25

  build-apk:
    needs: validate-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare the bundled V26 web assets
        run: python3 scripts/prepare_web_bundle.py --source . --target assets/webcore

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter platforms
        run: bash ./tool/prepare_platforms.sh

      - name: Remove default Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Fix flutter_inappwebview Android ProGuard config for AGP 9+
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find "$HOME/.pub-cache" -type f -path '*/flutter_inappwebview_android-*/android/build.gradle' 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "flutter_inappwebview_android build.gradle not found"
            exit 1
          fi
          while IFS= read -r f; do
            echo "Patching $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
          done <<< "$matches"

      - name: Validate bundled web assets
        run: |
          set -euo pipefail
          node --check assets/webcore/app.js
          node --check assets/webcore/arcpilot.js
          node --check assets/webcore/sw.js
          python3 scripts/verify_web_bundle.py --site assets/webcore --require-v26

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v26-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  deploy-pages:
    needs: validate-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the exact website that GitHub Pages will publish
        run: python3 scripts/prepare_web_bundle.py --source . --target assets/webcore

      - name: Validate the exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/webcore/app.js
          node --check assets/webcore/arcpilot.js
          node --check assets/webcore/sw.js
          python3 scripts/verify_web_bundle.py --site assets/webcore --require-v26
          cmp -s index.html assets/webcore/index.html
          cmp -s arcpilot.js assets/webcore/arcpilot.js
          cmp -s v26-arcpilot.css assets/webcore/v26-arcpilot.css
          cmp -s sw.js assets/webcore/sw.js
          echo "The exact GitHub Pages bundle is valid and in sync with the V26 source."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Winter Arc website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: assets/webcore

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
