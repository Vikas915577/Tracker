name: Winter Arc V26 Phase 2-4 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: winter-arc-v26-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare-and-upload-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Tracker repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout pinned YaarJam V2 offline source
        uses: actions/checkout@v4
        with:
          repository: Vikas915577/Couple-game-
          ref: 8f9f206d12835617c8974d8668a8a56fb060c54b
          path: .phase4-source
          fetch-depth: 1

      - name: Create safety backup branch before patching
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_BRANCH="phase2-4-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${BACKUP_BRANCH}"
          echo "Created safety branch: ${BACKUP_BRANCH}"

      - name: Apply frontend stability repair (Phase 2)
        run: python3 phase2_stability_patch.py --repo .

      - name: Apply XP, levels and achievements (Phase 3)
        run: python3 phase3_xp_achievements_patch.py --repo .

      - name: Integrate isolated offline arcade (Phase 4)
        run: python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --no-publish

      - name: Prepare canonical GitHub Pages bundle
        run: python3 prepare_web_bundle.py --source . --target assets/webcore

      - name: Copy arcade into the exact Pages bundle
        run: python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --publish assets/webcore

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check arcpilot.js
          node --check sw.js
          node --check arcade/app.js
          node --check arcade/sw.js
          node --check assets/webcore/app.js
          node --check assets/webcore/arcade/app.js
          node --check assets/webcore/arcade/sw.js

      - name: Verify Phase 2, Phase 3, Phase 4 and published bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 phase4_local_arcade_test.py --repo . --site assets/webcore
          python3 verify_web_bundle.py --site assets/webcore

      - name: Commit validated frontend and arcade to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml \
            phase2_stability_patch.py phase2_stability_test.py \
            phase3_xp_achievements_patch.py phase3_xp_achievements_test.py \
            phase4_local_arcade_patch.py phase4_local_arcade_test.py \
            app.js index.html sw.js lib/main.dart pubspec.yaml \
            arcade assets/webcore
          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Repair V26 startup and add offline arcade phases 2-4 [skip ci]"
            if git push origin HEAD:main; then
              echo "Validated source and webcore committed to main."
            else
              echo "::warning::Main branch source push was denied. The verified Pages artifact can still deploy; the backup branch is preserved."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages bundle
        uses: actions/upload-pages-artifact@v4
        with:
          path: assets/webcore

  deploy-pages:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified bundle
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Tracker repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout pinned YaarJam V2 offline source
        uses: actions/checkout@v4
        with:
          repository: Vikas915577/Couple-game-
          ref: 8f9f206d12835617c8974d8668a8a56fb060c54b
          path: .phase4-source
          fetch-depth: 1
      - name: Prepare and validate Android web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 phase2_stability_patch.py --repo .
          python3 phase3_xp_achievements_patch.py --repo .
          python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --no-publish
          python3 prepare_web_bundle.py --source . --target assets/webcore
          python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --publish assets/webcore
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 phase4_local_arcade_test.py --repo . --site assets/webcore
          python3 verify_web_bundle.py --site assets/webcore
          node --check assets/webcore/app.js
          node --check assets/webcore/arcade/app.js
          node --check assets/webcore/arcade/sw.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platforms
        run: bash ./tool/prepare_platforms.sh
      - name: Remove default Flutter sample test
        run: rm -f test/widget_test.dart
      - name: Get Flutter packages
        run: flutter pub get
      - name: Analyze Flutter project
        run: flutter analyze
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v26-phase4-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
