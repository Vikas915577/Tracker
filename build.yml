name: Winter Arc V26 Safe Release — Phases 2 to 5

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: winter-arc-v26-safe-release
  cancel-in-progress: true

# No contents:write and no branch creation are needed. Source backup is uploaded
# as an artifact, while Pages receives only the fully validated web bundle.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prepare-and-upload-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Tracker source
        uses: actions/checkout@v4

      - name: Create downloadable pre-build source backup
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/tracker-source-before-v26-build.zip" HEAD

      - name: Upload source backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-source-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/tracker-source-before-v26-build.zip
          if-no-files-found: error
          retention-days: 14

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned YaarJam V2 offline source
        uses: actions/checkout@v4
        with:
          repository: Vikas915577/Couple-game-
          ref: 8f9f206d12835617c8974d8668a8a56fb060c54b
          path: .phase4-source
          fetch-depth: 1

      - name: Phase 2 — repair app startup and local data safety
        run: python3 phase2_stability_patch.py --repo .

      - name: Phase 3 — add XP, levels and achievements
        run: python3 phase3_xp_achievements_patch.py --repo .

      - name: Phase 4 — add isolated offline arcade
        run: python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --no-publish

      - name: Prepare bundle for Phase 2–4 baseline QA
        run: |
          set -euo pipefail
          python3 prepare_web_bundle.py --source . --target assets/webcore
          python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --publish assets/webcore

      - name: Verify Phase 2–4 baseline before Phase 5
        shell: bash
        run: |
          set -euo pipefail
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 phase4_local_arcade_test.py --repo . --site assets/webcore

      - name: Phase 5 — add local virtual pet and premium companion UI
        run: python3 phase5_virtual_pet_patch.py --repo .

      - name: Verify Phase 3 patch remains idempotent after Phase 5
        run: python3 phase3_xp_achievements_patch.py --repo .

      - name: Rebuild exact Pages bundle after Phase 5
        shell: bash
        run: |
          set -euo pipefail
          python3 prepare_web_bundle.py --source . --target assets/webcore
          python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --publish assets/webcore

      - name: Final JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check arcpilot.js
          node --check sw.js
          node --check arcade/app.js
          node --check arcade/sw.js
          node --check assets/webcore/app.js
          node --check assets/webcore/arcade/app.js
          node --check assets/webcore/arcade/sw.js

      - name: Final Phase 2, 3, 4, 5 and deployment bundle QA
        shell: bash
        run: |
          set -euo pipefail
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 phase4_local_arcade_test.py --repo . --site assets/webcore
          python3 phase5_virtual_pet_test.py --repo . --site assets/webcore
          python3 verify_web_bundle.py --site assets/webcore

      - name: Upload patched source snapshot for optional manual review
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v26-phases-2-5-patched-source-${{ github.run_id }}
          path: |
            app.js
            index.html
            sw.js
            arcade/
            assets/webcore/
            lib/main.dart
            pubspec.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: assets/webcore

  deploy-pages:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact validated bundle
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Tracker source
        uses: actions/checkout@v4
      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned YaarJam V2 offline source
        uses: actions/checkout@v4
        with:
          repository: Vikas915577/Couple-game-
          ref: 8f9f206d12835617c8974d8668a8a56fb060c54b
          path: .phase4-source
          fetch-depth: 1

      - name: Apply and verify Phases 2–5 for Android web runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 phase2_stability_patch.py --repo .
          python3 phase3_xp_achievements_patch.py --repo .
          python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --no-publish
          python3 phase5_virtual_pet_patch.py --repo .
          python3 phase3_xp_achievements_patch.py --repo .
          python3 prepare_web_bundle.py --source . --target assets/webcore
          python3 phase4_local_arcade_patch.py --repo . --source .phase4-source --publish assets/webcore
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 phase4_local_arcade_test.py --repo . --site assets/webcore
          python3 phase5_virtual_pet_test.py --repo . --site assets/webcore
          python3 verify_web_bundle.py --site assets/webcore
          node --check assets/webcore/app.js
          node --check assets/webcore/arcade/app.js
          node --check assets/webcore/arcade/sw.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platforms
        run: bash ./tool/prepare_platforms.sh
      - name: Remove default Flutter sample test
        run: rm -f test/widget_test.dart
      - name: Get Flutter packages
        run: flutter pub get
      - name: Fix flutter_inappwebview Android ProGuard config for AGP 9+
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find "$HOME/.pub-cache" -type f -path '*/flutter_inappwebview_android-*/android/build.gradle' 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "flutter_inappwebview_android build.gradle not found"
            exit 1
          fi
          while IFS= read -r f; do
            echo "Patching $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
          done <<< "$matches"
      - name: Analyze Flutter project
        run: flutter analyze
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v26-phases-2-5-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
