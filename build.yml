name: Winter Arc Phase 2 Stability Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: winter-arc-phase2-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare-and-upload-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create safety backup branch before changing code
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_BRANCH="phase2-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${BACKUP_BRANCH}"
          echo "Created safety branch: ${BACKUP_BRANCH}"

      - name: Patch startup and habit-date issues (local frontend only)
        run: |
          set -euo pipefail
          python3 phase2_stability_patch.py --repo .
          python3 repair_app_boot.py app.js --index index.html
          python3 phase3_xp_achievements_patch.py --repo .

      - name: Prepare one canonical GitHub Pages bundle
        run: python3 prepare_web_bundle.py --source . --target assets/webcore

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check arcpilot.js
          node --check sw.js
          node --check assets/webcore/app.js
          node --check assets/webcore/arcpilot.js
          node --check assets/webcore/sw.js

      - name: Verify tracker data, UI assets and exact published bundle
        run: |
          set -euo pipefail
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 verify_web_bundle.py --site assets/webcore

      - name: Commit repaired source and synchronized webcore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js lib/main.dart pubspec.yaml assets/webcore
          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Stabilize Winter Arc frontend and sync V26 webcore [skip ci]"
            if git push origin HEAD:main; then
              echo "Repaired source and webcore committed to main."
            else
              echo "::warning::Main-branch source push was denied. This run will still deploy the validated artifact; the backup branch exists."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the exact verified Pages directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: assets/webcore

  deploy-pages:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Winter Arc frontend
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and check Android web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 phase2_stability_patch.py --repo .
          python3 repair_app_boot.py app.js --index index.html
          python3 phase3_xp_achievements_patch.py --repo .
          python3 prepare_web_bundle.py --source . --target assets/webcore
          python3 phase2_stability_test.py --repo . --site assets/webcore
          python3 phase3_xp_achievements_test.py --repo . --site assets/webcore
          python3 verify_web_bundle.py --site assets/webcore
          node --check assets/webcore/app.js
          node --check assets/webcore/sw.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter platform folders
        run: bash ./tool/prepare_platforms.sh

      - name: Remove default Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v26-phase2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
