name: Winter Arc V26 Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: winter-arc-v26-pages
  cancel-in-progress: true

jobs:
  prepare-and-upload-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair cloudSync binding and boot guidance
        run: python3 scripts/repair_app_boot.py app.js --index index.html

      - name: Build one consistent Pages bundle from the root source
        run: python3 scripts/prepare_web_bundle.py --source . --target assets/webcore

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check arcpilot.js
          node --check sw.js
          node --check assets/webcore/app.js
          node --check assets/webcore/arcpilot.js
          node --check assets/webcore/sw.js

      - name: Validate the exact website artifact
        run: python3 scripts/verify_web_bundle.py --site assets/webcore

      - name: Persist the source hotfix when repository token permits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "Source already contains the V26 cloudSync fix."
          else
            git commit -m "Fix V26 cloudSync startup binding [skip ci]"
            if git push origin HEAD:main; then
              echo "V26 source fix saved to main."
            else
              echo "::warning::Source commit could not be pushed by GITHUB_TOKEN. The validated Pages artifact is still prepared for this run."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified website
        uses: actions/upload-pages-artifact@v4
        with:
          path: assets/webcore

  deploy-pages:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified V26 artifact
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    needs: prepare-and-upload-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair and prepare bundled V26 web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair_app_boot.py app.js --index index.html
          python3 scripts/prepare_web_bundle.py --source . --target assets/webcore
          node --check assets/webcore/app.js
          node --check assets/webcore/arcpilot.js
          node --check assets/webcore/sw.js
          python3 scripts/verify_web_bundle.py --site assets/webcore

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter platforms
        run: bash ./tool/prepare_platforms.sh

      - name: Remove default Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Fix flutter_inappwebview Android ProGuard config for AGP 9+
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find "$HOME/.pub-cache" -type f -path '*/flutter_inappwebview_android-*/android/build.gradle' 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "flutter_inappwebview_android build.gradle not found"
            exit 1
          fi
          while IFS= read -r f; do
            echo "Patching $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
          done <<< "$matches"

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-v26-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
