name: Install Winter Arc V25.4

on:
  push:
    paths:
      - 'Winter-Arc-V25.4-Production-Ready.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract production package
        run: |
          rm -rf __v25_install
          mkdir __v25_install
          unzip -q 'Winter-Arc-V25.4-Production-Ready.zip' -d __v25_install
          cp -a __v25_install/. ./
          rm -rf __v25_install 'Winter-Arc-V25.4-Production-Ready.zip'

      - name: Commit extracted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Install Winter Arc V25.4 production structure'
          git push
